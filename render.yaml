services:
  - type: web
    name: elite-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SALON_TIMEZONE
        value: Asia/Kolkata
      - key: SALON_ID
        value: elite-primary
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: elite-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: elite-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        fromService:
          type: web
          name: elite-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: elite-web
          envVarKey: RENDER_EXTERNAL_URL
